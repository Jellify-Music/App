buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"

        // F-Droid / FOSS build (-Pfoss=true): no proprietary Google libraries.
        isFossBuild = (findProperty("foss") ?: "false").toString().toBoolean()
        // Read by react-native-nitro-player (see patches/) to compile out Google Cast.
        nitroPlayerCastEnabled = !isFossBuild
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"
