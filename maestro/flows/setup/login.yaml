appId: com.cosmonautical.jellify
---

# Continue from previous test
- assertVisible:
    id: "username_input"

# Take screenshot of login screen
- takeScreenshot: screenshots/setup/initial_login_screen_state

# Enter username
- tapOn:
    id: "username_input"
- inputText: "${username}"
- runFlow:
    file: ../../subflows/platform/submit-input.yaml
    env:
      button_id: sign_in_button

# Wait for sign in to finish. Library selection comes next, unless the
# server has a single music library, in which case onboarding skips it
- extendedWaitUntil:
    notVisible:
      id: "server_authentication_screen"
    timeout: 30000

# Take screenshot of the screen after sign in
- takeScreenshot: screenshots/setup/login_result_screen

