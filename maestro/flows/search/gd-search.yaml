appId: com.cosmonautical.jellify
---

# Earlier flows can leave the Search tab on a pushed detail screen, or scrolled away from the input.
# A pushed screen removes search-input from the hierarchy, so scrolling alone can't recover it.

# Bring the input back into view if the root is just scrolled
- scrollUntilVisible:
    element:
        id: "search-input"
    direction: UP
    timeout: 20000
    optional: true

# If it's still missing, a detail screen is covering the root — pop it, re-selecting the tab each time so we can't back out of the app
- repeat:
    times: 3
    while:
      notVisible:
        id: "search-input"
    commands:
      - pressKey: BACK
      - waitForAnimationToEnd
      - tapOn:
          id: "search-tab-button"
      - waitForAnimationToEnd

# The restored root may still be scrolled — final scroll up
- scrollUntilVisible:
    element:
        id: "search-input"
    direction: UP
    timeout: 20000
    optional: true

- assertVisible:
    id: "search-input"

# Tap on the search input to focus it and bring up the keyboard
- tapOn:
    id: "search-input"

# Erase any existing text in the search input
- eraseText

# Search for the Grateful Dead
- inputText: "Grateful Dead"

# Hide the keyboard to reveal search results
- hideKeyboard

# Wait for results to load
- waitForAnimationToEnd

# Take screenshot of search results
- takeScreenshot: screenshots/search/search_results_screen

# Ensure the Grateful Dead artist result is visible and tap on it
- assertVisible:
    id: "artist-search-result-0"
- tapOn:
    id: "artist-search-result-0"

# Take screenshot of artist from search
- takeScreenshot: screenshots/search/artist_from_search_screen

# Run the artist subflow to verify we can navigate to the artist page from search results and that the page loads correctly
- runFlow: ../../subflows/artist/flow.yaml
