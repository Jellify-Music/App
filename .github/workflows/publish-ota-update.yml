name: Publish / OTA Update
on:
  workflow_dispatch:

jobs:
  publish-ota-update:
    if: github.repository == 'Jellify-Music/App'
    runs-on: [self-hosted, Linux]
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.SIGNING_REPO_PAT }}

      - name: 📥 Install dependencies
        uses: ./.github/actions/install-deps

      - name: 👩‍💻 Configure Git
        run: |
          git config --global user.email "violet@cosmonautical.cloud"
          git config --global user.name "anultravioletaurora"

      - name: 🤖 Publish Android Update
        run: bun run sendOTA:android
        env:
          SIGNING_REPO_PAT: ${{ secrets.SIGNING_REPO_PAT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: 🍎 Publish iOS Update
        run: bun run sendOTA:iOS
        env:
          SIGNING_REPO_PAT: ${{ secrets.SIGNING_REPO_PAT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: 💬 Echo package.json version to Github Output
        id: setver
        run: echo "version=$(bun -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: 📝 Generate Release Notes
        id: notes
        uses: ./.github/actions/generate-release-notes
        with:
          version: ${{ steps.setver.outputs.version }}
          kind: ota
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          github_token: ${{ secrets.SIGNING_REPO_PAT }}

      - name: 🎉 Publish Release
        uses: ./.github/actions/publish-release
        with:
          tag: ${{ steps.notes.outputs.tag }}
          title: ${{ steps.notes.outputs.title }}
          body: ${{ steps.notes.outputs.release_body }}
          notes: ${{ steps.notes.outputs.release_notes }}
          kind: ota
          # Tag the commit the bundles were built from
          commit: ${{ github.sha }}
          github_token: ${{ secrets.SIGNING_REPO_PAT }}
          discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
