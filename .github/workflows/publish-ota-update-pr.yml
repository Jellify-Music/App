name: Publish / OTA Update PR
on:
  pull_request:
    paths:
      - 'src/**'
      - 'App.tsx'
      - '.github/workflows/publish-ota-update-pr.yml'
      - 'scripts/ota-PR.sh'
      - 'scripts/getRandomVersion.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish-ota-update:
    if: github.repository == 'Jellify-Music/App'
    # Fork PRs go to GitHub's runners, never Jellify's own hardware. A
    # missing head repo (deleted fork) counts as a fork.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux"]') }}
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.SIGNING_REPO_PAT }}

      - name: 📥 Install dependencies
        uses: ./.github/actions/install-deps

      - name: 👩‍💻 Configure Git
        run: |
          git config --global user.email "violet@cosmonautical.cloud"
          git config --global user.name "anultravioletaurora"

      - name: 🤖 Publish Update
        run: bun run sendOTA:PR ${{ github.event.pull_request.number }}
        env:
          SIGNING_REPO_PAT: ${{ secrets.SIGNING_REPO_PAT }}

