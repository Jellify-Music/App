name: Build / Android APK
on:
  pull_request:
    paths:
      - '.github/workflows/build-android.yml'
      - 'android/**'
      - 'package.json'


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    # Fork PRs go to GitHub's runners, never Jellify's own hardware. A
    # missing head repo (deleted fork) counts as a fork.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux"]') }}
    steps:
      - name: 🛒 Checkout
        uses: actions/checkout@v6

      - name: 📥 Install dependencies
        uses: ./.github/actions/install-deps

      # The self-hosted Linux runners have no JDK or Android SDK.
      # setup-android accepts the SDK licenses, so Gradle downloads the
      # platform, build tools, NDK and CMake that android/build.gradle asks
      # for.
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: 💬 Echo package.json version to Github ENV
        run: echo VERSION_NUMBER=$(bun -p "require('./package.json').version") >> $GITHUB_ENV

      - name: 🔑 Decode and setup release keystore
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.ANDROID_SIGNING_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_SIGNING_BASE64 }}" | base64 --decode > android/app/jellify.keystore
            echo "Release keystore created"
          else
            echo "No keystore secret found, will use debug keystore"
          fi

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/turbo
            android/.gradle
            android/app/build
          key: ${{ runner.os }}-gradle-turbo-${{ hashFiles('**/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-turbo-

      - name: 🚀 Run turbo build
        run: bun android-build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}


      - name: 📦 Upload APK for testing
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jellify-android-pr-${{ github.event.number }}-${{ env.VERSION_NUMBER }}
          path: |
            android/app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: warn
