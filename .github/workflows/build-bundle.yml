name: Build / JS Bundle

on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-bundle:
    # Fork PRs go to GitHub's runners, never Jellify's own hardware. A
    # missing head repo (deleted fork) counts as a fork.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux"]') }}

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v6

      - name: 📥 Install dependencies
        uses: ./.github/actions/install-deps


      - name: 🧩 Build JS bundle for iOS
        run: |
          mkdir -p ios/build
          bun x react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output ios/main.jsbundle \
            --assets-dest ios

      - name: 🧩 Build JS bundle for Android
        run: |
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res
          bun x react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
