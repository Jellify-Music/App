name: Install pods
description: 'Set up Ruby and gems (GitHub-hosted runners only), restore ios/Pods and run bun pod:install'
runs:
  using: "composite"
  steps:
    # Reads ios/.ruby-version, and bundler-cache installs and caches the
    # gems from ios/Gemfile.lock. The self-hosted runners will have Ruby
    # provisioned by Ansible (Nomadable), which owns its version there, and
    # keep their gems between jobs, so bun pod:install's bundle install
    # covers them.
    - name: 💎 Setup Ruby
      if: runner.environment != 'self-hosted'
      uses: ruby/setup-ruby@v1
      with:
        working-directory: ios
        bundler-cache: true

    # Gemfile.lock is in the key so a CocoaPods bump is never served Pods
    # installed by the previous version.
    - name: 📦 Cache Pods
      uses: actions/cache@v6
      with:
        path: ios/Pods
        key: ${{ runner.os }}-${{ runner.arch }}-pods-${{ hashFiles('ios/Podfile.lock', 'ios/Gemfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-pods-

    - name: 🍎 Install pods
      shell: bash
      run: bun pod:install
