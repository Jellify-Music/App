name: Generate Release Notes
description: 'Work out the tag and title for a release, then write its notes from the PRs merged since the previous release'
inputs:
  version:
    description: 'The app version (e.g., 1.3.1)'
    required: true
  kind:
    description: 'full for a store release, ota for an over-the-air update'
    required: false
    default: 'full'
  openai_api_key:
    description: 'API key for generating the narrative'
    required: true
  github_token:
    description: 'Token for reading PRs, issues and commits'
    required: true
outputs:
  tag:
    description: 'The tag to create: the version, or <version>-ota.<n> for an OTA'
    value: ${{ steps.release.outputs.tag }}
  title:
    description: 'The release title: the version, or <version> OTA <n> for an OTA'
    value: ${{ steps.release.outputs.title }}
  previous_tag:
    description: 'The tag the notes are counted from'
    value: ${{ steps.release.outputs.previous }}
  release_notes:
    description: 'The narrative on its own, for store listings'
    value: ${{ steps.set-output.outputs.release_notes }}
  release_body:
    description: 'The narrative followed by the issues, PRs and contributors, for the GitHub release'
    value: ${{ steps.set-output.outputs.release_body }}
runs:
  using: "composite"
  steps:
    # A full release counts from the previous full release, so store users see everything since
    # their last update, including what already went out over the air. An OTA counts from the
    # previous tag of any kind, so it only covers what is new.
    - name: 🏷️ Work out the tag and title
      id: release
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        KIND: ${{ inputs.kind }}
      run: |
        git fetch --tags --force --quiet

        if [ "$KIND" = "ota" ]; then
          last=0
          for existing in $(git tag -l "${VERSION}-ota.*"); do
            n="${existing##*-ota.}"
            if [[ "$n" =~ ^[0-9]+$ ]] && (( n > last )); then last=$n; fi
          done
          number=$((last + 1))

          tag="${VERSION}-ota.${number}"
          title="${VERSION} OTA ${number}"
          previous=$(git describe --tags --abbrev=0 --match '[0-9]*' --exclude "$tag" HEAD)
        else
          tag="$VERSION"
          title="$VERSION"
          previous=$(git describe --tags --abbrev=0 --match '[0-9]*' --exclude '*-*' --exclude "$tag" HEAD)
        fi

        echo "Releasing $title as $tag, counting from $previous"
        {
          echo "tag=$tag"
          echo "title=$title"
          echo "previous=$previous"
        } >> "$GITHUB_OUTPUT"

    - name: 🔎 Collect merged PRs, issues and contributors
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PREVIOUS_TAG: ${{ steps.release.outputs.previous }}
        TAG: ${{ steps.release.outputs.tag }}
      run: bun scripts/collect-release-changes.js "$PREVIOUS_TAG" "$TAG" "$(git rev-parse HEAD)"

    - name: 📜 Write the narrative
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        RELEASE_KIND: ${{ inputs.kind }}
        TITLE: ${{ steps.release.outputs.title }}
      run: bun scripts/generate-release-notes.js "$TITLE" release-changes.json

    - name: 🧾 Export the notes
      id: set-output
      shell: bash
      run: |
        delimiter="EOF_${RANDOM}${RANDOM}${RANDOM}"
        {
          echo "release_notes<<$delimiter"
          cat release_notes.txt
          echo
          echo "$delimiter"

          echo "release_body<<$delimiter"
          cat release_notes.txt
          printf '\n\n'
          cat release-changes.md
          echo "$delimiter"
        } >> "$GITHUB_OUTPUT"
